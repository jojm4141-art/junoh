<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음악 앱 레이아웃</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 전체 디바이스 프레임 -->
  <div class="device-frame">
    
    <!-- 1. 헤드 영역 -->
    <header class="header-section">
      <div class="search-bar">검색</div>
      <button class="action-btn">작업</button>
    </header>

    <!-- 구분선 (검은 띠) -->
    <div class="divider"></div>

    <!-- 2. 본문 영역 (음악 영역) -->
    <main class="main-section">
      <div class="grid-container">
        <div class="card">TOP100</div>
        <div class="card">힙합/팝</div>
        <div class="card">발라드</div>
        <div class="card">해외</div>
      </div>
    </main>

    <!-- 구분선 (검은 띠) -->
    <div class="divider"></div>

    <!-- 3. 작업 영역 -->
    <section class="work-section">
      <div class="grid-container">
        <div class="card">나의<br>작업물</div>
        <div class="card">나의 저장 음악</div>
      </div>
    </section>

    <!-- 하단 패턴 영역 -->
    <footer class="footer-pattern">
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
    </footer>

  </div>

</body>
</html>
